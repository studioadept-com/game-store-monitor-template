name: Monitor game releases
run-name: Manual game store check

# Scheduled checks run in Google Cloud: Cloud Scheduler calls the Cloud Run service
# every five minutes (see README.md). This workflow is for manual checks and
# diagnostics; it shares the same state in Cloud Storage.
"on":
  workflow_dispatch:
    inputs:
      telegram_test:
        description: Send a Telegram connection test only
        type: boolean
        default: false
      discord_test:
        description: Send a connection test to every Discord channel only
        type: boolean
        default: false
      dry_run:
        description: Read stores without saving state or sending notifications
        type: boolean
        default: false

concurrency:
  group: game-store-monitor
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Authenticate Google with keyless identity
        if: inputs.telegram_test != true && inputs.discord_test != true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Load Discord webhooks
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        # Each Discord channel names its own DISCORD_WEBHOOK_URL* secret in config.json.
        run: |
          python - <<'EOF' >> "$GITHUB_ENV"
          import json, os, re
          for name, value in json.loads(os.environ["ALL_SECRETS"]).items():
              if re.fullmatch(r"DISCORD_WEBHOOK_URL(_[A-Z0-9]+)*", name) and "\n" not in value:
                  print(f"{name}={value}")
          EOF
      - name: Check stores and send changes
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TEST_TELEGRAM: ${{ inputs.telegram_test }}
          TEST_DISCORD: ${{ inputs.discord_test }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$STATE_BUCKET" ]; then
            echo "STATE_BUCKET repository variable is not set" >&2
            exit 1
          fi
          if [ "$TEST_TELEGRAM" = 'true' ]; then
            python -m store_monitor --test-telegram
          elif [ "$TEST_DISCORD" = 'true' ]; then
            python -m store_monitor --test-discord
          elif [ "$DRY_RUN" = 'true' ]; then
            python -m store_monitor --dry-run
          else
            python -m store_monitor
          fi
